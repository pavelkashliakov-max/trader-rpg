<!DOCTYPE html>
<html lang="ru" data-theme="neon">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>TRADER RPG - Академия Трейдинга</title>

<!-- Telegram WebApp SDK -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
:root {
  --bg: #060a10; --panel: #0c121b; --panel2: #111925; --line: #1d2a3a;
  --text: #f4f7fb; --muted: #8290a4; --green: #35e59a; --red: #ff6075; --gold: #f7c65f; --blue: #59d7ff;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0; min-height:100vh; color:var(--text); background:var(--bg);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; user-select:none;
}
button,input{font:inherit} button{cursor:pointer}
.app{max-width:600px;margin:auto;padding-bottom:40px}

.header{padding:14px 16px;position:sticky;top:0;z-index:20;background:var(--bg);backdrop-filter:blur(15px);border-bottom:1px solid var(--line)}
.topline{display:flex;align-items:center;justify-content:space-between}
.brand{font-size:12px;letter-spacing:.15em;font-weight:900;color:var(--muted)}
.lvl-badge{font-size:12px;font-weight:900;color:var(--green);background:rgba(53,229,154,.1);padding:4px 10px;border-radius:20px;border:1px solid var(--green)}

.profile{margin:12px 16px;padding:16px;border-radius:20px;background:var(--panel);border:1px solid var(--line);display:flex;gap:15px;align-items:center}
.avatar{font-size:36px;background:var(--panel2);padding:10px;border-radius:16px;border:1px solid var(--line)}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 16px 12px}
.stat{padding:10px;border:1px solid var(--line);background:var(--panel);border-radius:14px;text-align:center}
.stat b{display:block;font-size:14px;margin-bottom:2px}
.stat span{font-size:9px;color:var(--muted);text-transform:uppercase}

.xp-wrap{padding:0 16px 16px}
.xpbar{height:10px;background:var(--panel2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.fill{height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--green));transition:width .45s ease}

.path-title{margin:16px 16px 8px;font-size:14px;font-weight:800;color:var(--muted)}
.path{display:flex;flex-direction:column;gap:8px;padding:0 16px}
.node{width:100%;min-height:56px;border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:12px;display:flex;align-items:center;gap:12px;color:var(--text);transition:.2s}
.node.active{border-color:var(--green);box-shadow:0 0 15px rgba(53,229,154,.15)}
.node.done{opacity:.6}
.node-num{font-weight:900;font-size:16px;width:30px;text-align:center}

.modal{position:fixed;inset:0;z-index:50;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.8);backdrop-filter:blur(6px)}
.modal.show{display:flex}
.modal-card{width:min(600px,100%);max-height:85vh;overflow:auto;padding:20px;background:var(--panel);border:1px solid var(--line);border-radius:24px 24px 0 0}

.quiz-opt{width:100%;border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:12px;padding:12px;font-size:12px;font-weight:700;text-align:left;margin-top:8px}
.quiz-opt:active{border-color:var(--green)}
</style>
</head>
<body>

<div class="app">
  <header class="header">
    <div class="topline">
      <div class="brand">ACADEMY RPG</div>
      <div class="lvl-badge" id="lvlBadge">LVL 1</div>
    </div>
  </header>

  <main>
    <section class="profile">
      <div class="avatar" id="userAvatar">🥷</div>
      <div>
        <h1 id="userRank" style="margin:0;font-size:18px">Ученик Рынка</h1>
        <p style="margin:4px 0 0;color:var(--muted);font-size:11px">Пройдите 200 уроков, изучите Смарт Мани и сдайте экзамены боссам.</p>
      </div>
    </section>

    <section class="stats">
      <div class="stat"><b id="xpCount">0 XP</b><span>Опыт</span></div>
      <div class="stat"><b id="completedCount">0 / 200</b><span>Пройдено</span></div>
      <div class="stat"><b id="coins">0 $</b><span>Баланс</span></div>
    </section>

    <section class="xp-wrap">
      <div class="xpbar"><div id="bar" class="fill"></div></div>
    </section>

    <div class="path-title">Карта Обучения:</div>
    <div id="path" class="path"></div>
  </main>
</div>

<!-- МОДАЛЬНОЕ ОКНО УРОКА -->
<div id="modal" class="modal">
  <div class="modal-card">
    <h3 id="lessonTitle" style="margin-top:0">Название урока</h3>
    <div id="lessonBody" style="font-size:13px;line-height:1.5;color:var(--muted)"></div>
    <div id="quizArea" style="margin-top:20px;border-top:1px dashed var(--line);padding-top:15px"></div>
    <button id="closeBtn" style="width:100%;margin-top:15px;padding:10px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);color:var(--text)">Закрыть</button>
  </div>
</div>

<script>
// --- ИНИЦИАЛИЗА TELEGRAM MINI APP ---
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); }
function haptic() { if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light'); }

// --- ИНТЕГРАЦИЯ С БЭКЕНДОМ (RENDER.COM) ---
// ⚠️ Укажите здесь ВАШУ ссылку на Render
const API_URL = "https://trader-rpg-api.onrender.com"; 
const userId = tg?.initDataUnsafe?.user?.id || 12345678;

// Данные
const STORAGE = "trader_rpg_edu_data";
let data = JSON.parse(localStorage.getItem(STORAGE)) || { xp: 0, current: 0, coins: 0, energy: 100, clan: 'Нет' };

// Сохранение локально и на сервер Render
async function save() {
  localStorage.setItem(STORAGE, JSON.stringify(data));
  try {
    await fetch(`${API_URL}/api/user/save`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        user_id: userId,
        xp: data.xp,
        coins: data.coins,
        energy: data.energy || 100,
        current_lesson: data.current,
        clan: data.clan || 'Нет'
      })
    });
  } catch(e) {
    console.error("Ошибка сохранения на сервер:", e);
  }
}

// Загрузка данных с сервера Render при запуске
async function loadServerData() {
  try {
    const res = await fetch(`${API_URL}/api/user/${userId}`);
    const serverData = await res.json();
    if (serverData && serverData.user_id) {
      data.xp = serverData.xp;
      data.coins = serverData.coins;
      data.current = serverData.current;
      data.energy = serverData.energy;
      data.clan = serverData.clan;
      renderPath();
    }
  } catch (e) {
    console.warn("Работаем в автономном режиме:", e);
  }
}

// База из 200 обучающих концептов
const LESSONS = Array.from({length: 200}, (_, i) => ({
  id: i + 1,
  title: `Урок ${i + 1}: ${getLessonTitle(i)}`,
  text: getLessonText(i),
  q: getLessonQuestion(i),
  opts: getLessonOptions(i),
  ans: 0,
  xp: 20,
  coins: 50
}));

function getLessonTitle(i) {
  const titles = ["Японские свечи", "Тренды и Линии Support/Resistance", "Order Block и Имбаланс", "Структура BOS и CHOCH", "Снятие Ликвидности (Sweep)", "Зоны OTE (Fibonacci)", "Риск-менеджмент 1%", "Психология и FOMO"];
  return titles[i % titles.length] + ` (Модуль ${Math.floor(i/8)+1})`;
}

function getLessonText(i) {
  return `В этом уроке мы изучаем ключевой концепт #${i+1}. На рынке важно уметь находить точки входа с наименьшим риском. Соблюдайте дисциплину и не входите в сделки без подтверждения структуры!`;
}

function getLessonQuestion(i) {
  return `Какой главный принцип концепта #${i+1}?`;
}

function getLessonOptions(i) {
  return ["Искать подтверждение на младшем таймфрейме", "Входить на весь депозит без стопа", "Торговать против тренда"];
}

function renderPath() {
  const box = document.getElementById('path');
  box.innerHTML = '';

  LESSONS.forEach((l, i) => {
    if (i > data.current + 3) return;

    const isDone = i < data.current;
    const isActive = i === data.current;

    const div = document.createElement('div');
    div.className = `node ${isDone ? 'done' : ''} ${isActive ? 'active' : ''}`;
    div.innerHTML = `
      <div class="node-num">${isDone ? '✓' : isActive ? '⚡' : '🔒'}</div>
      <div style="flex:1">
        <b style="font-size:13px;display:block">${l.title}</b>
        <span style="font-size:10px;color:var(--muted)">+${l.xp} XP | +${l.coins} $</span>
      </div>
    `;

    div.onclick = () => {
      haptic();
      if (i <= data.current) openLesson(i);
    };

    box.appendChild(div);
  });

  const lvl = Math.floor(data.xp / 100) + 1;
  document.getElementById('lvlBadge').textContent = `LVL ${lvl}`;
  document.getElementById('xpCount').textContent = `${data.xp} XP`;
  document.getElementById('completedCount').textContent = `${data.current} / 200`;
  document.getElementById('coins').textContent = `${data.coins} $`;
  document.getElementById('bar').style.width = (data.xp % 100) + '%';
}

function openLesson(index) {
  const l = LESSONS[index];
  document.getElementById('lessonTitle').textContent = l.title;
  document.getElementById('lessonBody').textContent = l.text;

  const quizArea = document.getElementById('quizArea');
  if (index === data.current) {
    quizArea.innerHTML = `
      <b style="font-size:13px;color:var(--text)">❓ Проверка знаний: ${l.q}</b>
      ${l.opts.map((opt, idx) => `<button class="quiz-opt" onclick="submitAnswer(${index}, ${idx})">${opt}</button>`).join('')}
    `;
  } else {
    quizArea.innerHTML = `<b style="color:var(--green);font-size:12px">✅ Урок успешно пройден!</b>`;
  }

  document.getElementById('modal').classList.add('show');
}

function submitAnswer(lessonIndex, optIndex) {
  haptic();
  const l = LESSONS[lessonIndex];
  if (optIndex === l.ans) {
    data.current++;
    data.xp += l.xp;
    data.coins += l.coins;
    save();
    renderPath();
    document.getElementById('modal').classList.remove('show');
    alert("🎉 Верно! Открыт следующий урок.");
  } else {
    alert("❌ Неверно. Попробуйте еще раз!");
  }
}

document.getElementById('closeBtn').onclick = () => document.getElementById('modal').classList.remove('show');

// Запуск приложения
loadServerData();
renderPath();
</script>
</body>
</html>
