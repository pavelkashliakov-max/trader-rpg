<!-- ЭКРАН: Академия -->
<div id="screen-academy" class="screen active">
    <h2 style="margin-bottom: 12px; font-weight: 800;">
        <i class="fa-solid fa-graduation-cap"></i> Обучение
    </h2>
    
    <!-- Карточка активного уровня -->
    <div class="glass-card" id="academy-card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
            <span id="phase-badge" style="font-size: 11px; color: var(--accent-cyan); font-weight: 700; text-transform: uppercase;">Phase 00</span>
            <span id="phase-energy-cost" style="font-size: 12px; color: var(--text-muted);">10 ⚡</span>
        </div>
        <h3 id="phase-title" style="margin-bottom: 12px;">Загрузка уровня...</h3>
        
        <!-- Шаг 1: Изучение теории -->
        <div style="background: rgba(0,0,0,0.3); padding: 12px; border-radius: 10px; margin-bottom: 16px; border-left: 3px solid var(--accent-cyan);">
            <div style="margin-bottom: 6px;"><strong style="color: var(--accent-cyan);">📌 ФАКТ:</strong> <span id="theory-fact" style="font-size: 13px;">...</span></div>
            <div style="margin-bottom: 6px;"><strong style="color: var(--accent-gold);">💡 ИНТЕРПРЕТАЦИЯ:</strong> <span id="theory-interp" style="font-size: 13px;">...</span></div>
            <div><strong style="color: var(--accent-green);">🚀 ГИПОТЕЗА:</strong> <span id="theory-hypo" style="font-size: 13px;">...</span></div>
        </div>

        <!-- Шаг 2: Прохождение теста -->
        <h4 style="font-size: 14px; margin-bottom: 8px;"><i class="fa-solid fa-clipboard-question"></i> Проверка знаний:</h4>
        <p id="quiz-question-text" style="font-size: 13px; margin-bottom: 10px; color: var(--text-main);"></p>
        
        <div id="quiz-options-container" style="display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px;">
            <!-- Варианты ответов сгенерируются автоматически -->
        </div>

        <!-- Шаг 3: Нажатие "Выполнил" -->
        <button class="btn-cyber" id="btn-submit-phase" onclick="submitCurrentPhase()">
            <i class="fa-solid fa-check-circle"></i> Выполнил / Сдать зачет
        </button>
    </div>
</div>

<style>
    .quiz-opt-btn {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid var(--glass-border);
        border-radius: 10px;
        padding: 10px;
        color: var(--text-main);
        font-size: 13px;
        text-align: left;
        cursor: pointer;
        transition: all 0.2s;
    }
    .quiz-opt-btn.selected {
        border-color: var(--accent-cyan);
        background: rgba(0, 242, 254, 0.15);
    }
</style>

<script>
    let currentPhasesList = [];
    let activePhaseIndex = 0;
    let selectedOptionIndex = null;

    async function loadAcademyData() {
        try {
            const res = await fetch(`${API_URL}/api/phases/${userData.user_id}`);
            if (res.ok) {
                const data = await res.json();
                currentPhasesList = data.phases;
                renderActivePhase();
            }
        } catch (e) {
            console.error("Ошибка загрузки данных обучения", e);
        }
    }

    function renderActivePhase() {
        if (!currentPhasesList || !currentPhasesList.length) return;
        
        // Находим первый непройденный уровень
        let idx = currentPhasesList.findIndex(p => !p.is_completed);
        if (idx === -1) idx = currentPhasesList.length - 1; 
        activePhaseIndex = idx;
        
        const phase = currentPhasesList[activePhaseIndex];
        selectedOptionIndex = null;

        document.getElementById('phase-badge').innerText = phase.id.toUpperCase();
        document.getElementById('phase-energy-cost').innerText = `${phase.energy_cost} ⚡`;
        document.getElementById('phase-title').innerText = phase.title;
        
        document.getElementById('theory-fact').innerText = phase.theory.fact;
        document.getElementById('theory-interp').innerText = phase.theory.interpretation;
        document.getElementById('theory-hypo').innerText = phase.theory.hypothesis;

        document.getElementById('quiz-question-text').innerText = phase.question;

        const optionsBox = document.getElementById('quiz-options-container');
        optionsBox.innerHTML = '';
        phase.options.forEach((optText, optIdx) => {
            optionsBox.innerHTML += `
                <button class="quiz-opt-btn" onclick="selectQuizOption(${optIdx}, this)">
                    ${optText}
                </button>
            `;
        });
    }

    function selectQuizOption(index, btnElem) {
        selectedOptionIndex = index;
        document.querySelectorAll('.quiz-opt-btn').forEach(b => b.classList.remove('selected'));
        btnElem.classList.add('selected');
    }

    async function submitCurrentPhase() {
        if (selectedOptionIndex === null) {
            alert("Пожалуйста, выберите вариант ответа на вопрос теста!");
            return;
        }

        const phase = currentPhasesList[activePhaseIndex];

        try {
            const res = await fetch(`${API_URL}/api/phases/complete`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    user_id: userData.user_id,
                    phase_id: phase.id,
                    selected_option: selectedOptionIndex
                })
            });

            const result = await res.json();

            if (result.success) {
                alert(`Успех! ${result.message}\nНаграда: +${phase.reward.coins} монет, +${phase.reward.xp} XP`);
                
                // Обновляем локальное состояние пользователя и интерфейс
                userData.coins = result.coins;
                userData.xp = result.xp;
                userData.energy = result.energy;
                if (typeof updateUI === 'function') updateUI();

                // Загружаем следующий уровень
                await loadAcademyData();
            } else {
                alert(`Ошибка: ${result.message}`);
            }
        } catch (e) {
            alert("Ошибка соединения с сервером.");
        }
    }

    // Инициализация при старте
    document.addEventListener("DOMContentLoaded", () => {
        loadAcademyData();
    });
</script>
